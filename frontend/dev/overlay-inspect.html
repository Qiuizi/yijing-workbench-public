<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Element Plus 浮层主题自检</title>
    <style>
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text-primary);
        font-family: var(--font-ui);
      }
      .harness {
        padding: 24px 28px;
        display: grid;
        gap: 18px;
        max-width: 900px;
      }
      .harness h1 {
        margin: 0;
        font-size: 22px;
        color: var(--text-primary);
      }
      .harness__hint {
        margin: 0;
        font-size: 13px;
        color: var(--text-muted);
      }
      .harness__row {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
      }
      .harness__muted {
        color: var(--text-secondary);
      }
      .probe {
        padding: 8px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius-sm);
        background: var(--surface);
        color: var(--text-primary);
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      .probe:hover {
        border-color: var(--accent-line);
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./overlay-inspect.ts"></script>
  </body>
</html>
