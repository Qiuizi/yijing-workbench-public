name: Setup Windows toolchain
description: >-
  Pin the Windows release toolchain to Python 3.12, Node.js 24, and Rust
  1.98.1, including the Node lockfile cache used by both Windows workflows.
  Does not install project dependencies and does not accept signing secrets.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: '1.98.1'
        targets: x86_64-pc-windows-msvc

    - name: Verify pinned toolchain versions
      shell: pwsh
      run: |
        $python = (& python -c "import sys; print(f'{sys.version_info[0]}.{sys.version_info[1]}')").Trim()
        if ($LASTEXITCODE -ne 0 -or $python -ne '3.12') { throw "Expected Python 3.12, got $python" }
        $node = (& node -p "process.versions.node.split('.')[0]").Trim()
        if ($LASTEXITCODE -ne 0 -or $node -ne '24') { throw "Expected Node.js 24, got $node" }
        $rustc = (& rustc --version)
        if ($LASTEXITCODE -ne 0 -or $rustc -notmatch 'rustc 1\.98\.1\b') { throw "Expected rustc 1.98.1, got $rustc" }
        Write-Output "toolchain ok: Python $python; Node $node; $rustc"
