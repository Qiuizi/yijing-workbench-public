name: Windows x64 candidate build

on:
  # main 上不加路径过滤：正式发布门禁要求「最终 main SHA 上存在 Windows 候选构建结果」。
  # PR 侧仍按路径过滤以控制成本。
  push:
    branches: [main]
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'scripts/updater/**'
      - 'scripts/build_sidecar.ps1'
      - 'scripts/smoke_packaged_sidecar.ps1'
      - 'requirements-win.lock.txt'
      - 'requirements-build.txt'
      - '.github/workflows/windows-rc.yml'
      - '.github/actions/**'
  workflow_dispatch:

permissions:
  contents: read

# 候选构建绝不使用正式签名私钥：要么用仓库级候选密钥，要么用本次运行生成的临时密钥。
# A successful PR merge-test build is NOT the artifact of main's actual commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  windows-rc:
    name: Windows x64 tests and NSIS candidate
    runs-on: windows-2022
    timeout-minutes: 80
    outputs:
      artifact-id: ${{ steps.upload-candidate.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload-candidate.outputs.artifact-digest }}
      verifier-artifact-id: ${{ steps.upload-verifier.outputs.artifact-id }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Set up Windows toolchain
        uses: ./.github/actions/setup-windows-toolchain

      - name: Read and validate application version
        run: |
          $conf = Get-Content 'frontend/src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          $version = $conf.version
          if ($version -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') { throw "Invalid version: $version" }
          "YIJING_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "Building version $version"

      - name: Verify all version sources agree
        run: |
          python -c "from scripts.updater.manifest import assert_versions_consistent; print('versions ok:', assert_versions_consistent('.'))"
          if ($LASTEXITCODE -ne 0) { throw 'version consistency check failed' }

      - name: Install frozen Python release dependencies
        uses: ./.github/actions/install-frozen-windows-deps
        with:
          python: 'true'
          frontend: 'false'

      - name: Windows backend regression tests
        uses: ./.github/actions/run-windows-regression
        with:
          backend: 'true'
          vitest: 'false'
          typecheck: 'false'

      - name: Install frontend locked dependencies
        uses: ./.github/actions/install-frozen-windows-deps
        with:
          python: 'false'
          frontend: 'true'

      - name: Frontend regression tests
        uses: ./.github/actions/run-windows-regression
        with:
          backend: 'false'
          vitest: 'true'
          typecheck: 'false'

      - name: Typecheck
        uses: ./.github/actions/run-windows-regression
        with:
          backend: 'false'
          vitest: 'false'
          typecheck: 'true'

      - name: Find and verify the VS2022 VC143 x64 redist
        uses: ./.github/actions/discover-vc143

      # 更新签名只在构建步骤内可见，且绝不使用正式私钥。
      # tauri.conf.json 里现在是正式公钥，不能再拿另一把候选私钥给它签名。
      # 没有候选密钥时，本步骤生成临时密钥，并把临时公钥注入这次构建。
      - name: Build PyInstaller sidecar and updater-signed NSIS candidate
        working-directory: frontend
        env:
          YIJING_CANDIDATE_SIGNING_KEY: ${{ secrets.YIJING_CANDIDATE_SIGNING_KEY }}
          YIJING_CANDIDATE_SIGNING_KEY_PASSWORD: ${{ secrets.YIJING_CANDIDATE_SIGNING_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $override = Join-Path $env:RUNNER_TEMP 'updater-override.json'
          $pubkey = (Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json).plugins.updater.pubkey

          if ([string]::IsNullOrWhiteSpace($env:YIJING_CANDIDATE_SIGNING_KEY)) {
            $keyPath = Join-Path $env:RUNNER_TEMP 'candidate-ephemeral.key'
            npx tauri signer generate --ci -p 'candidate-ephemeral' -w $keyPath | Out-Null
            $env:TAURI_SIGNING_PRIVATE_KEY = (Get-Content -LiteralPath $keyPath -Raw)
            $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD = 'candidate-ephemeral'
            $pubkey = (Get-Content -LiteralPath "$keyPath.pub" -Raw)
            Write-Output 'signing: ephemeral candidate key (no repository secret configured)'
          } else {
            throw 'tauri.conf.json 已是正式公钥，不能用仓库候选私钥给它签名。请删除 YIJING_CANDIDATE_SIGNING_KEY，让本步骤生成临时密钥。'
          }

          @{
            bundle = @{ createUpdaterArtifacts = $true }
            plugins = @{ updater = @{ pubkey = $pubkey } }
          } | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath $override -Encoding utf8
          # 公钥是公开信息；后续步骤用它核对「签名 key id 与内置公钥一致」
          "YIJING_BUILD_PUBKEY=$pubkey" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

          npm run build:sidecar
          if ($LASTEXITCODE -ne 0) { throw 'sidecar build failed' }
          npx tauri build --bundles nsis --config $override
          if ($LASTEXITCODE -ne 0) { throw 'tauri build failed' }
          Write-Output 'candidate build finished'

      - name: Smoke-test the bundled Python sidecar (synthetic profile only)
        run: |
          $report = Join-Path $env:RUNNER_TEMP "yijing-rc-$($env:YIJING_VERSION)"
          New-Item -ItemType Directory -Force -Path $report | Out-Null
          & ./scripts/smoke_packaged_sidecar.ps1 `
            -SidecarPath 'frontend/src-tauri/binaries/yijing-backend/yijing-backend.exe' `
            -ReportPath (Join-Path $report 'sidecar-smoke.json')

      - name: Assemble candidate release metadata and verify the updater contract
        env:
          YIJING_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || '' }}
        run: |
          $version = $env:YIJING_VERSION
          $out = Join-Path $env:RUNNER_TEMP "yijing-rc-$version"
          python scripts/updater/build_release_dir.py `
            --bundle-dir 'frontend/src-tauri/target/release/bundle/nsis' `
            --out $out `
            --tag "v$version" `
            --version $version `
            --notes "候选构建（未发布），源码 $($env:GITHUB_SHA)。" `
            --source-sha $env:GITHUB_SHA `
            --source-ref $env:GITHUB_REF `
            --source-trigger $env:GITHUB_EVENT_NAME `
            --workflow-run "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" `
            --sidecar 'frontend/src-tauri/binaries/yijing-backend/yijing-backend.exe' `
            --updater-pubkey $env:YIJING_BUILD_PUBKEY
          if ($LASTEXITCODE -ne 0) { throw 'build_release_dir failed' }

          python scripts/updater/verify_release.py $out --tag "v$version" --expected-version $version
          if ($LASTEXITCODE -ne 0) { throw 'release contract verification failed' }

          $sidecar = 'frontend/src-tauri/binaries/yijing-backend/yijing-backend.exe'
          $releaseManifest = Get-Content (Join-Path $out 'manifest.json') -Raw | ConvertFrom-Json
          $rc = [ordered]@{
            version = $version
            source_sha = $env:GITHUB_SHA
            source_trigger = $env:GITHUB_EVENT_NAME
            source_ref = $env:GITHUB_REF
            pr_head_sha = $env:YIJING_PR_HEAD_SHA
            install_mode = 'currentUser'
            updater_signed = $true
            updater_pubkey_is_qa = $releaseManifest.updater_pubkey_is_qa
            updater_pubkey_source = $releaseManifest.updater_pubkey_source
            updater_pubkey_key_id = $releaseManifest.updater_pubkey_key_id
            signature_key_id = $releaseManifest.signature_key_id
            sidecar_smoke = 'PASS'
            gui_upgrade_tested = $false
            status = 'candidate-not-for-update-channel'
            installer = $releaseManifest.installer
            sidecar_sha256 = (Get-FileHash -LiteralPath $sidecar -Algorithm SHA256).Hash
            windows_runner = $env:ImageVersion
          }
          ($rc | ConvertTo-Json -Depth 6) | Set-Content -LiteralPath (Join-Path $out 'manifest-rc.json') -Encoding utf8
          Get-ChildItem -LiteralPath $out | Select-Object Name, Length

      - name: Write provenance for the immutable candidate bundle
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_WORKFLOW_SHA)) { throw 'GITHUB_WORKFLOW_SHA is empty' }
          if ([string]::IsNullOrWhiteSpace($env:YIJING_BUILD_PUBKEY)) { throw 'candidate public key was not exported' }
          $pythonVersion = (& python -c "import sys; print(f'{sys.version_info[0]}.{sys.version_info[1]}.{sys.version_info[2]}')").Trim()
          $nodeVersion = (& node -p "process.versions.node").Trim()
          $rustVersion = (& rustc --version).Trim()
          $out = Join-Path $env:RUNNER_TEMP "yijing-rc-$($env:YIJING_VERSION)"
          python scripts/updater/provenance.py write `
            --bundle-dir $out `
            --repository $env:GITHUB_REPOSITORY `
            --version $env:YIJING_VERSION `
            --source-sha $env:GITHUB_SHA `
            --workflow-ref $env:GITHUB_WORKFLOW_REF `
            --workflow-sha $env:GITHUB_WORKFLOW_SHA `
            --run-id $env:GITHUB_RUN_ID `
            --run-attempt $env:GITHUB_RUN_ATTEMPT `
            --event-name $env:GITHUB_EVENT_NAME `
            --runner-os $env:RUNNER_OS `
            --python-version $pythonVersion `
            --node-version $nodeVersion `
            --rust-version $rustVersion `
            --vc143-dir $env:YIJING_VC_REDIST_DIR `
            --signing-mode ephemeral_candidate `
            --updater-pubkey $env:YIJING_BUILD_PUBKEY `
            --artifact-name "yijing-workbench-$($env:YIJING_VERSION)-windows-x64-rc"
          if ($LASTEXITCODE -ne 0) { throw 'provenance write failed' }

      - name: Build signature verifier only
        working-directory: frontend/src-tauri
        run: cargo build --release --bin verify-updater-signature

      - name: Upload signature verifier
        id: upload-verifier
        uses: actions/upload-artifact@v4
        with:
          name: yijing-signature-verifier-${{ env.YIJING_VERSION }}
          path: frontend/src-tauri/target/release/verify-updater-signature.exe
          if-no-files-found: error
          retention-days: 14
          overwrite: false

      - name: Upload candidate artifacts (never a public Release, never the update channel)
        id: upload-candidate
        uses: actions/upload-artifact@v4
        with:
          name: yijing-workbench-${{ env.YIJING_VERSION }}-windows-x64-rc
          path: ${{ runner.temp }}/yijing-rc-${{ env.YIJING_VERSION }}/*
          if-no-files-found: error
          retention-days: 14
          overwrite: false

  verify-candidate-artifact:
    name: Verify immutable candidate artifact
    needs: windows-rc
    runs-on: windows-2022
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Windows toolchain
        uses: ./.github/actions/setup-windows-toolchain

      - name: Download the uploaded artifact by id
        id: download
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.windows-rc.outputs.artifact-id }}
          path: downloaded-artifact
          merge-multiple: true

      - name: Download the signature verifier by id
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.windows-rc.outputs.verifier-artifact-id }}
          path: downloaded-verifier
          merge-multiple: true

      - name: Verify downloaded artifact identity, hashes, manifest and signature
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.windows-rc.outputs.artifact-id }}
          EXPECTED_DIGEST: ${{ needs.windows-rc.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$EXPECTED_DIGEST"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > artifact.json
          python scripts/updater/provenance.py verify \
            --bundle-dir downloaded-artifact \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-event-name "$GITHUB_EVENT_NAME" \
            --expected-signing-mode ephemeral_candidate \
            --expected-artifact-id "$ARTIFACT_ID" \
            --observed-artifact-id "$(python -c 'import json; print(json.load(open("artifact.json"))["id"])')" \
            --expected-artifact-digest "$EXPECTED_DIGEST" \
            --observed-artifact-digest "$(python -c 'import json; print(json.load(open("artifact.json"))["digest"])')" \
            --observed-artifact-name "$(python -c 'import json; print(json.load(open("artifact.json"))["name"])')" \
            --signature-verifier downloaded-verifier/verify-updater-signature.exe
          test "$(python -c 'import json; print(str(json.load(open("artifact.json"))["expired"]).lower())')" = "false"

  attest-candidate-artifact:
    name: Attest immutable candidate artifact
    needs:
      - windows-rc
      - verify-candidate-artifact
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - name: Download the same artifact by id
        id: download
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.windows-rc.outputs.artifact-id }}
          path: downloaded-artifact
          merge-multiple: true

      - name: Attest the verified candidate files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: downloaded-artifact/**

      - name: Verify the GitHub attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          installer=$(find downloaded-artifact -type f -name '*-x64-setup.exe' | head -n 1)
          test -n "$installer"
          gh attestation verify "$installer" --repo "$GITHUB_REPOSITORY"
