# 正式发布流水线：Build once → Verify → Production Sign → Verify signed → Publish
#
# Tauri CLI 2.11.5 只在 bundle.createUpdaterArtifacts 不是 false 时签名。
# 构建覆盖把它设为 false，所以未签名 NSIS 不需要正式私钥。签名是独立的
# .sig，不改安装包字节。候选临时公钥包不能当成正式包。
#
# 默认 dry_run=true 且 exercise_production_sign=false：只构建、验证、证明，
# 不进 release 环境，不读私钥，不创建 tag/release，不改官网。
# exercise_production_sign=true 仍保持 dry_run，可以做非公开正式签名演练。
# dry_run=false 才会发布；本阶段不运行那条路径。
name: Publish stable release (updater-enabled)

on:
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号（必须与仓库版本一致，例如 3.3.2）'
        required: true
      confirm:
        description: '再次输入同一个版本号以确认发布'
        required: true
      notes_file:
        description: 'Release 说明文件（只允许 docs/release-notes-v<版本>.md）'
        required: true
        default: 'docs/release-notes-v3.3.2.md'
      dry_run:
        description: '只构建与校验，不创建 Release（默认开启）'
        type: boolean
        default: true
      exercise_production_sign:
        description: 'dry run 中额外做非公开正式签名演练（默认关闭，需要 release 环境审批）'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: yijing-release
  cancel-in-progress: false

jobs:
  build:
    name: Build unsigned staging artifact
    if: github.repository == 'Qiuizi/yijing-workbench-public'
    runs-on: windows-2022
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload-staging.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload-staging.outputs.artifact-digest }}
      installer-sha256: ${{ steps.assemble-staging.outputs.installer-sha256 }}
    defaults:
      run:
        shell: pwsh
    env:
      YIJING_VERSION_INPUT: ${{ inputs.version }}
      YIJING_CONFIRM_INPUT: ${{ inputs.confirm }}
      YIJING_NOTES_FILE: ${{ inputs.notes_file }}
      YIJING_PINNED_SHA: ${{ github.sha }}
    steps:
      - name: Checkout the exact dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Preflight inputs, ref, SHA and tag availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/updater/release_preflight.py `
            --version $env:YIJING_VERSION_INPUT `
            --confirm $env:YIJING_CONFIRM_INPUT `
            --notes-file $env:YIJING_NOTES_FILE `
            --pinned-sha $env:YIJING_PINNED_SHA `
            --ref $env:GITHUB_REF `
            --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) { throw 'preflight failed' }

      - name: Set up Windows toolchain
        uses: ./.github/actions/setup-windows-toolchain

      - name: Require the committed production public key
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY -or $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw 'build job must not see the production private key'
          }
          python scripts/updater/release_gate.py --expect-version $env:YIJING_VERSION_INPUT
          if ($LASTEXITCODE -ne 0) { throw 'version/public key gate failed' }

      - name: Require green CI for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/updater/ci_gate.py `
            --repo $env:GITHUB_REPOSITORY `
            --sha $env:YIJING_PINNED_SHA `
            --json-out ci-gate.json
          if ($LASTEXITCODE -ne 0) { throw 'CI gate failed: 该 SHA 缺少必需检查或未全部通过' }

      - name: Install dependencies
        uses: ./.github/actions/install-frozen-windows-deps

      - name: Regression tests before the release build
        uses: ./.github/actions/run-windows-regression

      - name: Find and verify the VS2022 VC143 x64 redist
        uses: ./.github/actions/discover-vc143

      - name: Build sidecar and unsigned NSIS installer
        working-directory: frontend
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY -or $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw 'build job must not see the production private key'
          }
          $override = Join-Path $env:RUNNER_TEMP 'unsigned-override.json'
          python ../scripts/updater/staging_bundle.py write-override --out $override
          if ($LASTEXITCODE -ne 0) { throw 'unsigned override failed' }
          $overrideDoc = Get-Content -LiteralPath $override -Raw | ConvertFrom-Json
          if ($overrideDoc.bundle.createUpdaterArtifacts -ne $false) {
            throw 'unsigned build must set createUpdaterArtifacts false'
          }
          npm run build:sidecar
          if ($LASTEXITCODE -ne 0) { throw 'sidecar build failed' }
          npx tauri build --bundles nsis --config $override
          if ($LASTEXITCODE -ne 0) { throw 'tauri build failed' }
          $signed = Get-ChildItem -LiteralPath 'src-tauri/target/release/bundle/nsis' -Filter '*.sig' -File -ErrorAction SilentlyContinue
          if ($signed) { throw 'unsigned NSIS build produced a signature; private key must not have been present' }

      - name: Smoke-test the packaged sidecar (synthetic profile only)
        run: |
          & ./scripts/smoke_packaged_sidecar.ps1 `
            -SidecarPath 'frontend/src-tauri/binaries/yijing-backend/yijing-backend.exe' `
            -ReportPath (Join-Path $env:RUNNER_TEMP 'sidecar-smoke.json')
          if ($LASTEXITCODE -ne 0) { throw 'packaged sidecar smoke failed' }
          Copy-Item -LiteralPath (Join-Path $env:RUNNER_TEMP 'sidecar-smoke.json') -Destination 'sidecar-smoke.json' -Force

      - name: Assemble unsigned staging bundle
        id: assemble-staging
        run: |
          $out = Join-Path $env:RUNNER_TEMP "yijing-staging-$($env:YIJING_VERSION_INPUT)"
          python scripts/updater/staging_bundle.py assemble `
            --nsis-dir 'frontend/src-tauri/target/release/bundle/nsis' `
            --out $out `
            --version $env:YIJING_VERSION_INPUT `
            --source-sha $env:YIJING_PINNED_SHA `
            --source-ref $env:GITHUB_REF `
            --workflow-run "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" `
            --include ci-gate.json `
            --include sidecar-smoke.json `
            --github-output $env:GITHUB_OUTPUT
          if ($LASTEXITCODE -ne 0) { throw 'unsigned staging assembly failed' }

      - name: Write provenance for the unsigned staging bundle
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GITHUB_WORKFLOW_SHA)) { throw 'GITHUB_WORKFLOW_SHA is empty' }
          $pythonVersion = (& python -c "import sys; print(f'{sys.version_info[0]}.{sys.version_info[1]}.{sys.version_info[2]}')").Trim()
          $nodeVersion = (& node -p "process.versions.node").Trim()
          $rustVersion = (& rustc --version).Trim()
          $pubkey = (& python -c "import json; print(json.load(open('frontend/src-tauri/tauri.conf.json', encoding='utf-8'))['plugins']['updater']['pubkey'])").Trim()
          $out = Join-Path $env:RUNNER_TEMP "yijing-staging-$($env:YIJING_VERSION_INPUT)"
          python scripts/updater/provenance.py write `
            --bundle-dir $out `
            --repository $env:GITHUB_REPOSITORY `
            --version $env:YIJING_VERSION_INPUT `
            --source-sha $env:YIJING_PINNED_SHA `
            --workflow-ref $env:GITHUB_WORKFLOW_REF `
            --workflow-sha $env:GITHUB_WORKFLOW_SHA `
            --run-id $env:GITHUB_RUN_ID `
            --run-attempt $env:GITHUB_RUN_ATTEMPT `
            --event-name $env:GITHUB_EVENT_NAME `
            --runner-os $env:RUNNER_OS `
            --python-version $pythonVersion `
            --node-version $nodeVersion `
            --rust-version $rustVersion `
            --vc143-dir $env:YIJING_VC_REDIST_DIR `
            --signing-mode unsigned_staging `
            --updater-pubkey $pubkey `
            --artifact-name "yijing-workbench-$($env:YIJING_VERSION_INPUT)-windows-x64-staging"
          if ($LASTEXITCODE -ne 0) { throw 'provenance write failed' }

      - name: Upload unsigned staging artifact
        id: upload-staging
        uses: actions/upload-artifact@v4
        with:
          name: yijing-workbench-${{ env.YIJING_VERSION_INPUT }}-windows-x64-staging
          path: ${{ runner.temp }}/yijing-staging-${{ env.YIJING_VERSION_INPUT }}/*
          if-no-files-found: error
          retention-days: 14
          overwrite: false

  verify-staging:
    name: Verify unsigned staging artifact
    needs: build
    runs-on: windows-2022
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download the exact staging artifact and fail on digest mismatch
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          EXPECTED_DIGEST: ${{ needs.build.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$EXPECTED_DIGEST"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > artifact.json
          curl --fail --location --retry 3 --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --output artifact.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          python scripts/updater/artifact_digest.py \
            --metadata artifact.json \
            --zip-path artifact.zip \
            --expected-digest "$EXPECTED_DIGEST" \
            --expected-artifact-id "$ARTIFACT_ID" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-head-sha "$GITHUB_SHA" \
            --extract-dir downloaded-artifact

      - name: Verify staging identity, hashes, manifest and absent signature
        env:
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          EXPECTED_DIGEST: ${{ needs.build.outputs.artifact-digest }}
          EXPECTED_INSTALLER_SHA256: ${{ needs.build.outputs.installer-sha256 }}
        run: |
          set -euo pipefail
          test -z "$(find downloaded-artifact -name '*.sig' -o -name 'latest.json' | head -n 1)"
          expected_version="$(python -c "import json; print(json.load(open('frontend/src-tauri/tauri.conf.json', encoding='utf-8'))['version'])")"
          python scripts/updater/provenance.py verify \
            --bundle-dir downloaded-artifact \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-workflow-ref "$GITHUB_WORKFLOW_REF" \
            --expected-workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-event-name "$GITHUB_EVENT_NAME" \
            --expected-signing-mode unsigned_staging \
            --expected-version "$expected_version" \
            --expected-artifact-id "$ARTIFACT_ID" \
            --observed-artifact-id "$(python -c 'import json; print(json.load(open("artifact.json"))["id"])')" \
            --expected-artifact-digest "$EXPECTED_DIGEST" \
            --observed-artifact-digest "$(python -c 'import json; print(json.load(open("artifact.json"))["digest"])')" \
            --observed-artifact-name "$(python -c 'import json; print(json.load(open("artifact.json"))["name"])')"
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          version = json.load(open("frontend/src-tauri/tauri.conf.json", encoding="utf-8"))["version"]
          installer = Path("downloaded-artifact") / f"yijing-workbench-{version}-x64-setup.exe"
          actual = hashlib.sha256(installer.read_bytes()).hexdigest()
          expected = os.environ["EXPECTED_INSTALLER_SHA256"].strip().lower()
          if actual != expected:
              raise SystemExit(f"installer sha256 {actual} != build output {expected}")
          print("OK  staging installer hash matches build output")
          PY

  attest-staging:
    name: Attest unsigned staging artifact
    needs:
      - build
      - verify-staging
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download the same staging artifact and fail on digest mismatch
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          EXPECTED_DIGEST: ${{ needs.build.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$EXPECTED_DIGEST"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > artifact.json
          curl --fail --location --retry 3 --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --output artifact.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          python3 scripts/updater/artifact_digest.py \
            --metadata artifact.json \
            --zip-path artifact.zip \
            --expected-digest "$EXPECTED_DIGEST" \
            --expected-artifact-id "$ARTIFACT_ID" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-head-sha "$GITHUB_SHA" \
            --extract-dir downloaded-artifact

      - name: Attest the verified staging files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: downloaded-artifact/**

      - name: Reject a different workflow, source SHA, or OIDC issuer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          installer=$(find downloaded-artifact -type f -name '*-x64-setup.exe' -print -quit)
          test -n "$installer"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          set +e
          gh attestation verify "$installer" \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/windows-rc.yml@${GITHUB_REF}" \
            --source-digest "$GITHUB_SHA" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            --format json > wrong-workflow.json
          wrong_workflow=$?
          gh attestation verify "$installer" \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "$identity" \
            --source-digest "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            --format json > wrong-source.json
          wrong_source=$?
          gh attestation verify "$installer" \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "$identity" \
            --source-digest "$GITHUB_SHA" \
            --cert-oidc-issuer "https://evil.example" \
            --format json > wrong-issuer.json
          wrong_issuer=$?
          set -e
          test "$wrong_workflow" -ne 0
          test "$wrong_source" -ne 0
          test "$wrong_issuer" -ne 0
          echo "rejected wrong workflow, source SHA, and OIDC issuer"

      - name: Verify attestation identity, run, and every subject
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          mapfile -d '' files < <(find downloaded-artifact -type f -print0)
          test "${#files[@]}" -eq 7
          for file in "${files[@]}"; do
            gh attestation verify "$file" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$identity" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --signer-digest "$GITHUB_WORKFLOW_SHA" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              --deny-self-hosted-runners \
              --format json > attestation-verify.json
          done
          python3 scripts/updater/attestation_identity.py \
            --verification-json attestation-verify.json \
            --bundle-dir downloaded-artifact \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-ref "$GITHUB_REF" \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-path .github/workflows/release.yml \
            --bundle-profile release-staging
          python3 scripts/updater/attestation_identity.py \
            --verification-json attestation-verify.json \
            --bundle-dir downloaded-artifact \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-ref "$GITHUB_REF" \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --expected-run-id 1 \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-path .github/workflows/release.yml \
            --bundle-profile release-staging \
            && { echo "wrong Run ID was accepted" >&2; exit 1; }
          echo "rejected wrong Run ID"

  production-sign:
    name: Sign verified staging artifact
    needs:
      - build
      - verify-staging
      - attest-staging
    if: ${{ github.ref == 'refs/heads/main' && (inputs.exercise_production_sign || inputs.dry_run == false) }}
    runs-on: windows-2022
    timeout-minutes: 40
    environment: release
    permissions:
      contents: read
      actions: read
    outputs:
      artifact-id: ${{ steps.upload-signed.outputs.artifact-id }}
      artifact-digest: ${{ steps.upload-signed.outputs.artifact-digest }}
      installer-sha256: ${{ steps.sign-installer.outputs.installer-sha256 }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout the exact dispatched commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Windows toolchain
        uses: ./.github/actions/setup-windows-toolchain

      - name: Compile production signer from this checkout
        working-directory: scripts/updater/sign-artifact
        run: cargo build --release --locked

      - name: Download the verified staging artifact again
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          EXPECTED_DIGEST: ${{ needs.build.outputs.artifact-digest }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:ARTIFACT_ID)) { throw 'missing staging artifact id' }
          gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:ARTIFACT_ID" > artifact.json
          if ($LASTEXITCODE -ne 0) { throw 'artifact lookup failed' }
          curl.exe --fail --location --retry 3 --silent --show-error `
            --header "Authorization: Bearer $env:GH_TOKEN" `
            --header "Accept: application/vnd.github+json" `
            --output artifact.zip `
            "https://api.github.com/repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:ARTIFACT_ID/zip"
          if ($LASTEXITCODE -ne 0) { throw 'artifact download failed' }
          python scripts/updater/artifact_digest.py `
            --metadata artifact.json `
            --zip-path artifact.zip `
            --expected-digest $env:EXPECTED_DIGEST `
            --expected-artifact-id $env:ARTIFACT_ID `
            --expected-run-id $env:GITHUB_RUN_ID `
            --expected-head-sha $env:GITHUB_SHA `
            --extract-dir downloaded-artifact
          if ($LASTEXITCODE -ne 0) { throw 'staging digest check failed' }

      - name: Sign the verified installer with the production key
        id: sign-installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          TAURI_UPDATER_PUBKEY: ${{ secrets.TAURI_UPDATER_PUBKEY }}
          STAGING_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          STAGING_ARTIFACT_DIGEST: ${{ needs.build.outputs.artifact-digest }}
          EXPECTED_INSTALLER_SHA256: ${{ needs.build.outputs.installer-sha256 }}
          NOTES_FILE: ${{ inputs.notes_file }}
          VERSION: ${{ inputs.version }}
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/updater/release_gate.py --expect-version $env:VERSION --expect-pubkey $env:TAURI_UPDATER_PUBKEY
          if ($LASTEXITCODE -ne 0) { throw 'production public key does not match the repository' }
          $keyPath = Join-Path $env:RUNNER_TEMP 'production-signing.key'
          $out = Join-Path $env:RUNNER_TEMP "yijing-signed-$env:VERSION"
          try {
            [System.IO.File]::WriteAllText($keyPath, $env:TAURI_SIGNING_PRIVATE_KEY)
            python scripts/updater/production_sign.py assemble `
              --staging-dir downloaded-artifact `
              --out $out `
              --signer scripts/updater/sign-artifact/target/release/sign-artifact.exe `
              --key-file $keyPath `
              --version $env:VERSION `
              --tag "v$env:VERSION" `
              --notes-file $env:NOTES_FILE `
              --repo $env:GITHUB_REPOSITORY `
              --source-sha $env:GITHUB_SHA `
              --source-ref $env:GITHUB_REF `
              --workflow-run "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" `
              --staging-artifact-id $env:STAGING_ARTIFACT_ID `
              --staging-artifact-digest $env:STAGING_ARTIFACT_DIGEST `
              --expected-installer-sha256 $env:EXPECTED_INSTALLER_SHA256 `
              --github-output $env:GITHUB_OUTPUT
            if ($LASTEXITCODE -ne 0) { throw 'production sign failed' }
          } finally {
            if (Test-Path -LiteralPath $keyPath) { Remove-Item -LiteralPath $keyPath -Force }
          }

      - name: Write provenance for the signed bundle
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if ($env:TAURI_SIGNING_PRIVATE_KEY -or $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw 'provenance step must not see the production private key'
          }
          $pythonVersion = (& python -c "import sys; print(f'{sys.version_info[0]}.{sys.version_info[1]}.{sys.version_info[2]}')").Trim()
          $nodeVersion = (& node -p "process.versions.node").Trim()
          $rustVersion = (& rustc --version).Trim()
          $pubkey = (& python -c "import json; print(json.load(open('frontend/src-tauri/tauri.conf.json', encoding='utf-8'))['plugins']['updater']['pubkey'])").Trim()
          $out = Join-Path $env:RUNNER_TEMP "yijing-signed-$env:VERSION"
          python scripts/updater/provenance.py write `
            --bundle-dir $out `
            --repository $env:GITHUB_REPOSITORY `
            --version $env:VERSION `
            --source-sha $env:GITHUB_SHA `
            --workflow-ref $env:GITHUB_WORKFLOW_REF `
            --workflow-sha $env:GITHUB_WORKFLOW_SHA `
            --run-id $env:GITHUB_RUN_ID `
            --run-attempt $env:GITHUB_RUN_ATTEMPT `
            --event-name $env:GITHUB_EVENT_NAME `
            --runner-os $env:RUNNER_OS `
            --python-version $pythonVersion `
            --node-version $nodeVersion `
            --rust-version $rustVersion `
            --vc143-dir $env:YIJING_VC_REDIST_DIR `
            --signing-mode production `
            --updater-pubkey $pubkey `
            --artifact-name "yijing-workbench-$env:VERSION-windows-x64-signed"
          if ($LASTEXITCODE -ne 0) { throw 'signed provenance write failed' }

      - name: Upload signed artifact
        id: upload-signed
        uses: actions/upload-artifact@v4
        with:
          name: yijing-workbench-${{ inputs.version }}-windows-x64-signed
          path: ${{ runner.temp }}/yijing-signed-${{ inputs.version }}/*
          if-no-files-found: error
          retention-days: 14
          overwrite: false

  verify-signed:
    name: Verify signed artifact
    needs:
      - build
      - production-sign
    runs-on: windows-2022
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    outputs:
      installer-sha256: ${{ steps.chain.outputs.installer-sha256 }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Windows toolchain
        uses: ./.github/actions/setup-windows-toolchain

      - name: Compile signature verifier from this checkout
        working-directory: frontend/src-tauri
        env:
          YIJING_SKIP_TAURI_BUILD: "1"
        run: cargo build --release --bin verify-updater-signature

      - name: Download the exact signed artifact and fail on digest mismatch
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.production-sign.outputs.artifact-id }}
          EXPECTED_DIGEST: ${{ needs.production-sign.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$EXPECTED_DIGEST"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > artifact.json
          curl --fail --location --retry 3 --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --output artifact.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          python scripts/updater/artifact_digest.py \
            --metadata artifact.json \
            --zip-path artifact.zip \
            --expected-digest "$EXPECTED_DIGEST" \
            --expected-artifact-id "$ARTIFACT_ID" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-head-sha "$GITHUB_SHA" \
            --extract-dir downloaded-artifact

      - name: Verify signed identity, signature and unchanged installer bytes
        id: chain
        env:
          ARTIFACT_ID: ${{ needs.production-sign.outputs.artifact-id }}
          EXPECTED_DIGEST: ${{ needs.production-sign.outputs.artifact-digest }}
          STAGING_SHA256: ${{ needs.build.outputs.installer-sha256 }}
          SIGNED_SHA256: ${{ needs.production-sign.outputs.installer-sha256 }}
          STAGING_ARTIFACT_ID: ${{ needs.build.outputs.artifact-id }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          test "$STAGING_SHA256" = "$SIGNED_SHA256"
          pubkey="$(python -c "import json; print(json.load(open('frontend/src-tauri/tauri.conf.json', encoding='utf-8'))['plugins']['updater']['pubkey'])")"
          python scripts/updater/provenance.py verify \
            --bundle-dir downloaded-artifact \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-workflow-ref "$GITHUB_WORKFLOW_REF" \
            --expected-workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --expected-event-name "$GITHUB_EVENT_NAME" \
            --expected-signing-mode production \
            --expected-version "$VERSION" \
            --expected-artifact-id "$ARTIFACT_ID" \
            --observed-artifact-id "$(python -c 'import json; print(json.load(open("artifact.json"))["id"])')" \
            --expected-artifact-digest "$EXPECTED_DIGEST" \
            --observed-artifact-digest "$(python -c 'import json; print(json.load(open("artifact.json"))["digest"])')" \
            --observed-artifact-name "$(python -c 'import json; print(json.load(open("artifact.json"))["name"])')" \
            --signature-verifier frontend/src-tauri/target/release/verify-updater-signature.exe
          python scripts/updater/verify_release.py downloaded-artifact \
            --tag "v$VERSION" \
            --expected-version "$VERSION" \
            --production \
            --expect-pubkey "$pubkey" \
            --signature-verifier frontend/src-tauri/target/release/verify-updater-signature.exe
          python scripts/updater/production_sign.py verify-chain \
            --signed-dir downloaded-artifact \
            --expected-version "$VERSION" \
            --expected-installer-sha256 "$STAGING_SHA256" \
            --expected-staging-artifact-id "$STAGING_ARTIFACT_ID" \
            --expected-source-sha "$GITHUB_SHA"
          echo "installer-sha256=$STAGING_SHA256" >> "$GITHUB_OUTPUT"

  attest-signed:
    name: Attest signed artifact
    needs:
      - production-sign
      - verify-signed
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download the signed artifact and fail on digest mismatch
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.production-sign.outputs.artifact-id }}
          EXPECTED_DIGEST: ${{ needs.production-sign.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > artifact.json
          curl --fail --location --retry 3 --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --output artifact.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          python3 scripts/updater/artifact_digest.py \
            --metadata artifact.json \
            --zip-path artifact.zip \
            --expected-digest "$EXPECTED_DIGEST" \
            --expected-artifact-id "$ARTIFACT_ID" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-head-sha "$GITHUB_SHA" \
            --extract-dir downloaded-artifact

      - name: Attest the verified signed files
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: downloaded-artifact/**

      - name: Reject a different workflow, source SHA, or OIDC issuer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          installer=$(find downloaded-artifact -type f -name '*-x64-setup.exe' -print -quit)
          test -n "$installer"
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          set +e
          gh attestation verify "$installer" \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/${GITHUB_REPOSITORY}/.github/workflows/windows-rc.yml@${GITHUB_REF}" \
            --source-digest "$GITHUB_SHA" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            --format json > wrong-workflow.json
          wrong_workflow=$?
          gh attestation verify "$installer" \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "$identity" \
            --source-digest "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa" \
            --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
            --format json > wrong-source.json
          wrong_source=$?
          gh attestation verify "$installer" \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "$identity" \
            --source-digest "$GITHUB_SHA" \
            --cert-oidc-issuer "https://evil.example" \
            --format json > wrong-issuer.json
          wrong_issuer=$?
          set -e
          test "$wrong_workflow" -ne 0
          test "$wrong_source" -ne 0
          test "$wrong_issuer" -ne 0
          echo "rejected wrong workflow, source SHA, and OIDC issuer"

      - name: Verify signed attestation identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@${GITHUB_REF}"
          mapfile -d '' files < <(find downloaded-artifact -type f -print0)
          test "${#files[@]}" -eq 7
          for file in "${files[@]}"; do
            gh attestation verify "$file" \
              --repo "$GITHUB_REPOSITORY" \
              --cert-identity "$identity" \
              --source-ref "$GITHUB_REF" \
              --source-digest "$GITHUB_SHA" \
              --signer-digest "$GITHUB_WORKFLOW_SHA" \
              --cert-oidc-issuer "https://token.actions.githubusercontent.com" \
              --deny-self-hosted-runners \
              --format json > attestation-verify.json
          done
          python3 scripts/updater/attestation_identity.py \
            --verification-json attestation-verify.json \
            --bundle-dir downloaded-artifact \
            --expected-repository "$GITHUB_REPOSITORY" \
            --expected-ref "$GITHUB_REF" \
            --expected-source-sha "$GITHUB_SHA" \
            --expected-workflow-sha "$GITHUB_WORKFLOW_SHA" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT" \
            --workflow-path .github/workflows/release.yml \
            --bundle-profile release-signed

  publish:
    needs:
      - production-sign
      - verify-signed
    if: ${{ !inputs.dry_run && needs.verify-signed.result == 'success' && needs.production-sign.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download the verified signed artifact by id
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ needs.production-sign.outputs.artifact-id }}
          EXPECTED_DIGEST: ${{ needs.production-sign.outputs.artifact-digest }}
          EXPECTED_INSTALLER_SHA256: ${{ needs.verify-signed.outputs.installer-sha256 }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_ID"
          test -n "$EXPECTED_INSTALLER_SHA256"
          test "$GITHUB_SHA" = "${{ github.sha }}"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID" > artifact.json
          curl --fail --location --retry 3 --silent --show-error \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --output artifact.zip \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip"
          python3 scripts/updater/artifact_digest.py \
            --metadata artifact.json \
            --zip-path artifact.zip \
            --expected-digest "$EXPECTED_DIGEST" \
            --expected-artifact-id "$ARTIFACT_ID" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-head-sha "$GITHUB_SHA" \
            --extract-dir downloaded-artifact
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          version = json.load(open("frontend/src-tauri/tauri.conf.json", encoding="utf-8"))["version"]
          installer = Path("downloaded-artifact") / f"yijing-workbench-{version}-x64-setup.exe"
          actual = hashlib.sha256(installer.read_bytes()).hexdigest()
          expected = os.environ["EXPECTED_INSTALLER_SHA256"].strip().lower()
          if actual != expected:
              raise SystemExit(f"publish installer sha256 {actual} != verified {expected}")
          print("OK  publish bytes match verified signed artifact")
          PY

      - name: Refuse to overwrite an existing tag or release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "release already exists for $TAG" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "tag already exists for $TAG" >&2
            exit 1
          fi

      - name: Create draft release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NOTES_FILE: ${{ inputs.notes_file }}
          TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --draft --title "易经起卦工作台 $TAG" --notes-file "$NOTES_FILE"
          gh release upload "$TAG" \
            "downloaded-artifact/yijing-workbench-${TAG#v}-x64-setup.exe" \
            "downloaded-artifact/yijing-workbench-${TAG#v}-x64-setup.exe.sig" \
            "downloaded-artifact/latest.json" \
            "downloaded-artifact/SHA256SUMS.txt" \
            "downloaded-artifact/manifest.json" \
            "downloaded-artifact/PROVENANCE.md"

      - name: Re-read uploaded assets from the API and verify byte-for-byte
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess, sys
          tag = os.environ["TAG"]
          repo = os.environ["GITHUB_REPOSITORY"]
          release = json.loads(subprocess.check_output(["gh", "api", f"repos/{repo}/releases/tags/{tag}"], text=True))
          assets = {item["name"]: item for item in release["assets"]}
          required = [
              f"yijing-workbench-{tag.lstrip('v')}-x64-setup.exe",
              f"yijing-workbench-{tag.lstrip('v')}-x64-setup.exe.sig",
              "latest.json", "SHA256SUMS.txt", "manifest.json", "PROVENANCE.md",
          ]
          problems = [name for name in required if name not in assets]
          for name in required:
              local = os.path.join("downloaded-artifact", name)
              if not os.path.isfile(local):
                  problems.append(f"本地缺少 {name}")
                  continue
              size = os.path.getsize(local)
              if name in assets and assets[name]["size"] != size:
                  problems.append(f"{name} 上传后字节数 {assets[name]['size']} != 本地 {size}")
              digest = assets.get(name, {}).get("digest")
              actual = "sha256:" + hashlib.sha256(open(local, "rb").read()).hexdigest()
              if digest and digest != actual:
                  problems.append(f"{name} 上传后摘要与本地不一致")
          if problems:
              print("\n".join(problems), file=sys.stderr)
              sys.exit(1)
          print("uploaded assets verified:", ", ".join(sorted(assets)))
          PY

      - name: Publish the release (irreversible; latest.json enters the update channel)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest
          latest_tag=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name)
          test "$latest_tag" = "$TAG"

      - name: Verify the public latest.json served by releases/latest
        run: |
          set -euo pipefail
          url="https://github.com/$GITHUB_REPOSITORY/releases/latest/download/latest.json"
          expected=$(cat downloaded-artifact/latest.json)
          for attempt in $(seq 1 10); do
            remote=$(curl -fsSL "$url" || true)
            if [ "$remote" = "$expected" ]; then
              echo "public latest.json matches"
              exit 0
            fi
            sleep 15
          done
          echo "public latest.json does not match (CDN not converged or wrong upload)" >&2
          exit 1

      - name: Update website release facts and let Pages redeploy
        env:
          TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/updater/update_site_release.py --release-dir downloaded-artifact --tag "$TAG"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add website/src/links.ts
          if git diff --cached --quiet; then
            echo "site already up to date"
          else
            git commit -m "release(site): point download to $TAG"
            git push origin HEAD:main
          fi

  dry-run-check:
    needs:
      - build
      - verify-staging
      - attest-staging
      - production-sign
      - verify-signed
      - attest-signed
    if: ${{ inputs.dry_run && needs.build.result == 'success' && needs.verify-staging.result == 'success' && needs.attest-staging.result == 'success' && (needs.production-sign.result == 'success' || needs.production-sign.result == 'skipped') && (needs.verify-signed.result == 'success' || needs.verify-signed.result == 'skipped') && (needs.attest-signed.result == 'success' || needs.attest-signed.result == 'skipped') && (inputs.exercise_production_sign != true || needs.verify-signed.result == 'success') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Prove nothing was published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ inputs.version }}
        run: |
          set -euo pipefail
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" >/dev/null 2>&1; then
            echo "dry run 竟然创建了 release：$TAG" >&2
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "dry run 竟然创建了 tag：$TAG" >&2
            exit 1
          fi
          if grep -q "releases/tag/$TAG" website/src/links.ts; then
            echo "dry run 竟然改动了官网下载入口：$TAG" >&2
            exit 1
          fi
          echo "dry run 无副作用：无 tag、无 release、官网仍指向旧版本"
