name: V1 learning content and regression checks

on:
  pull_request:
    paths:
      - 'frontend/**'
      - 'backend/**'
      - 'docs/learning-guides*'
      - 'scripts/prepare_learning_review.py'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/v1-learning-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run unit tests
        working-directory: frontend
        run: npm test
      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck
      - name: Production build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run pytest
        run: python -m pytest
      - name: Build 64 independent editorial review packets (no approvals changed)
        run: python scripts/prepare_learning_review.py --output "$RUNNER_TEMP/yijing-review-packets"
      - name: Upload editable review packets (draft-only work material, not published)
        uses: actions/upload-artifact@v4
        with:
          name: yijing-64-hexagram-review-markdown
          path: ${{ runner.temp }}/yijing-review-packets/*.md
          if-no-files-found: error
          retention-days: 14
