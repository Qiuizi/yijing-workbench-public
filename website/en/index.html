<!doctype html>
<html lang="en" data-locale="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yijing Workbench</title>
    <meta name="description" content="A local-first Windows desktop app: coin casting, manual casting, traditional line readings, najia, and the full 64-hexagram source text all run on-device. Judgments and line texts are transcribed from the Wikisource Yijing." />
    <link rel="canonical" href="https://qiuizi.github.io/yijing-workbench-public/en/" />
    <link rel="icon" type="image/svg+xml" href="../favicon.svg" />
    <meta name="theme-color" content="#f8f4ea" />
    <script>
      // Set the theme before first paint so night mode never flashes white.
      (function () {
        try {
          var saved = localStorage.getItem('yijing-theme');
          var dark = saved
            ? saved === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Yijing Workbench" />
    <meta property="og:title" content="Yijing Workbench" />
    <meta property="og:description" content="A local-first Windows desktop app: coin casting, manual casting, traditional line readings, najia, and the full 64-hexagram source text all run on-device. Judgments and line texts are transcribed from the Wikisource Yijing." />
    <meta property="og:image" content="https://qiuizi.github.io/yijing-workbench-public/brand/og-cover.svg" />
    <meta property="og:locale" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="../src/main.ts"></script>
  </body>
</html>
